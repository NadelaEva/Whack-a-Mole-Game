<!DOCTYPE html>
<html lang="en">

  <head>
     <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <link rel="stylesheet" href="app.css">

      <title>Whack a Mole Game</title>
   </head>

  <body>  
      <h1>WHACK A MOLE</h1>

      <div class="history">
         <h3 class="score">Score : <span> 00 </span></h3>
         <h3 class="countdown">
             Time left : <span> 30 </span> <span> sec </span>
         </h3> 
      </div>

      <div class="in-game">
         <div class="hole"></div>
         <div class="hole"></div>
         <div class="hole"></div>
         <div class="hole"></div>
         <div class="hole"></div>
         <div class="hole"></div>
         <div class="hole"></div>
         <div class="hole"></div>
         <div class="hole"></div>
      </div>

      <div class="cursor"></div>
      <div class="final-score"> <span> </span></div>

      <button class="reset-btn">Reset Game</button>

      <script src="app.js"></script>
  </body>
</html>
